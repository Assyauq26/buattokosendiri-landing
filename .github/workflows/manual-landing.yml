name: Manual landing checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts and required static files
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check deploy/prepare-release.cjs
          bash -n deploy/activate-static-landing.sh
          test -s index.html
          test -s pendaftaran/index.html
          test -s panduan-instalasi/index.html
          test -s panduan-instalasi/panduan-instalasi.pdf
          test -s assets/img/hero-desktop.png
          test -s assets/img/hero-mobile.png
          test "$(head -c 4 panduan-instalasi/panduan-instalasi.pdf)" = '%PDF'
