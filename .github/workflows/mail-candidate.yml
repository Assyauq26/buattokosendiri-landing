name: Platform mail candidate verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['server/**', 'tests/**', 'agent/**', 'assets/js/platform.js', '.github/workflows/mail-candidate.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-platform-ci-only
          POSTGRES_DB: platform_m1_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Platform OTP, tenant isolation and lifecycle
        env:
          TEST_DATABASE_URL: postgresql://postgres:disposable-platform-ci-only@127.0.0.1:5432/platform_m1_test
        run: npm test
      - run: npm run build
      - run: python3 -m py_compile agent/agent.py
